# Workspace module map.
#
# Maps a module path to a local directory so codegen can resolve a spec from a
# sibling checkout instead of the network. A local checkout always wins. The
# version tag is the remote fallback.
version: "1"

modules:
  github.com/alexandremahdhaoui/poe-wayfinder-spec:
    path: ./poe-wayfinder-spec
    version: v0.1.0
    specs:
      - spec/poe-wayfinder.v1.yaml

  github.com/alexandremahdhaoui/poe-wayfinder-data:
    path: ./poe-wayfinder-data
    version: v0.1.0
    specs:
      - data/items.ndjson
      - data/stats.ndjson
      - data/client_strings.json
